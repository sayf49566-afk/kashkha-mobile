name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Murajaa Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set App Name inside Dart code to مراجعة
        run: sed -i "s/'shopName': 'كشخة للخياطة الرجالية'/'shopName': ''/g; s/: 'كشخة للخياطة الرجالية'/: 'مراجعة'/g; s/title: 'كشخة للخياطة - تطبيق المتابعة'/title: 'مراجعة'/g" lib/main.dart

      - name: Generate Android files
        run: flutter create --platforms=android --project-name kashkha_mobile_app .

      - name: Set Android Permission and Label to مراجعة
        run: sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>/; s/android:label="[^"]*"/android:label="مراجعة"/g' android/app/src/main/AndroidManifest.xml

      - name: Apply Custom Icon if uploaded
        run: if [ -f "assets/icon/app_icon.png" ]; then cp assets/icon/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png && cp assets/icon/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png && cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png && cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png && cp assets/icon/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: murajaa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
